echte_kamille:
  display_name: Echte Kamille
  botanical_name: Matricaria chamomilla / Matricaria recutita
  crop_group: medicinal_flowering_light_demanding
  use_type: Arzneipflanze / Sonder-Hauptackerfrucht
  critical_months:
  - Apr
  - May
  - Jun
  - Jul
  r_ann_min: 0.7
  r_ann_target: 0.85
  r_crit_min: 0.7
  r_crit_target: 0.85
  DLI_min: 18
  DLI_target: 24
  peak_PPFD_min: 800.0
  homogeneity_sensitivity: medium
  evidence_tier: C
  confidence_default: low-medium
  source_group: light germination + long-day plant + Landolt L=4 hell + medicinal
    crop agronomy
  source_references:
  - Echte_Kamille_Licht
  warning_text: Biomass suitability is not the same as active ingredient/quality suitability.
  notes_de: Kamille ist als Arznei-Hauptackerfrucht plausibler als viele mediterrane
    Kräuter, sollte aber bei starker Verschattung oder hoher Lichtheterogenität nur
    mit Feldtest empfohlen werden.

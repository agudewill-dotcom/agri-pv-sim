echte_kamille:
  display_name: German Chamomile
  botanical_name: Matricaria chamomilla / Matricaria recutita
  crop_group: medicinal_flowering_light_demanding
  supported_objectives:
  - reproductive
  - biomass
  biomass_target_type: Medicinal & Aromatic Herbal Biomass
  growing_season_months: &id001
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  biomass_critical_months: *id001
  reproductive_critical_months:
  - Apr
  - May
  - Jun
  - Jul
  thresholds:
    reproductive:
      r_ann_min: 0.7
      r_ann_target: 0.85
      r_crit_min: 0.7
      r_crit_target: 0.85
      DLI_min: 18
      DLI_target: 24
      peak_PPFD_min: 800.0
    biomass:
      r_gs_min: 0.7
      r_gs_target: 0.85
      DLI_min: 18
      DLI_target: 24
      DLI_p10_min: 14
      peak_PPFD_min: 800
      cv_PAR_warning: 0.22
      cv_PAR_critical: 0.3
  quality_warning: true
  notes_de: Chamomile is plausible as a special/medicinal crop under Agri-PV. Biomass
    or flower yield does not equate directly to active compound or essential oil concentration.
  evidence_tier: C
  confidence_default: low-medium
  source_group: light germination + long-day plant + Landolt L=4 hell + medicinal
    crop agronomy
  source_references:
  - Echte_Kamille_Licht
  warning_text: Biomass suitability does not guarantee active ingredient quality or
    essential oil content.
  use_type: Medicinal / Special Crop
